<div class="product-image" [class]="size()">
  @if (!imageError()) {
    <img
      [src]="value()"
      alt="Product image"
      (load)="onImageLoad()"
      (error)="onImageError()"
      [attr.class]="imageLoaded() ? 'loaded' : ''"
    />
  } @else {
    <div class="image-placeholder">No image</div>
  }
</div>
