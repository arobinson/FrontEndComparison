<div class="multi-select">
  <aff-button size="sm" extraClass="select-toggle" (clicked)="toggleDropdown()"><span>{{ displayText() }}</span><span class="arrow">▼</span></aff-button>

  @if (isOpen()) {
    <div class="dropdown">
      @for (option of options(); track option) {
        <label class="option">
          <input
            type="checkbox"
            [checked]="value().includes(option)"
            (change)="toggleOption(option)"
          />
          <span>{{ option }}</span>
        </label>
      }
    </div>
  }
</div>
